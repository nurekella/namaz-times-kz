name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Self-contained exe
        run: |
          V=${GITHUB_REF_NAME#v}
          dotnet publish NamazTimes.csproj -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=$V -p:GitHubRepo=$GITHUB_REPOSITORY -o out
      - name: MSI
        run: dotnet build installer -c Release -p:ProductVersion=${GITHUB_REF_NAME#v} -p:ExePath=../out/NamazTimes.exe -o msi
      - name: Release
        run: gh release create "$GITHUB_REF_NAME" out/NamazTimes.exe msi/*.msi --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
