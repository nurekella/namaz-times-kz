name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${GITHUB_REF_NAME#v} -o out
        shell: bash
      - run: gh release create "$GITHUB_REF_NAME" out/NamazTimes.exe --generate-notes
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
